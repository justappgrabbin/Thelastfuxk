name: Android APK build
on:
  push:
    branches: [fix/agent-autonomy-hands]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require complete source import
        run: |
          test -f build.sh || { echo "::error::Full v0.1.3 source has not been imported"; exit 1; }
          test -f AndroidManifest.xml
          test -f assets/alpine-coder.tar.gz
          test -f native/arm64-v8a/libllama_server.so
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and test
        run: |
          export ANDROID_PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          bash build.sh "$RUNNER_TEMP/The-Last-Fuck-debug.apk"
      - name: Run autonomy and existing regressions
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/json.jar" \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          JSON_JAR="$RUNNER_TEMP/json.jar" bash tests/run.sh
      - name: Check WebView JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re
          html=pathlib.Path("assets/computer.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.S | re.I)
          if len(scripts)!=1: raise SystemExit("Expected one WebView script")
          pathlib.Path("/tmp/lastfuxk-webview.js").write_text(scripts[0],encoding="utf-8")
          PY
          node --check /tmp/lastfuxk-webview.js
      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Fuck-debug-apk
          path: ${{ runner.temp }}/The-Last-Fuck-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified debug APK as a GitHub prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v0.1.4-zip-${GITHUB_SHA:0:12}"
          APK_NAME="The-Last-Fuxk-${GITHUB_SHA:0:12}.apk"
          cp "$RUNNER_TEMP/The-Last-Fuck-debug.apk" "$RUNNER_TEMP/$APK_NAME"
          sha256sum "$RUNNER_TEMP/$APK_NAME" > "$RUNNER_TEMP/$APK_NAME.sha256"
          sed -i "s|$RUNNER_TEMP/||" "$RUNNER_TEMP/$APK_NAME.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This exact source commit already has a release."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "The Last Fuxk 0.1.4 · ZIP runner · ${GITHUB_SHA:0:12}" \
            --notes "Source commit: $GITHUB_SHA. Includes ZIP web app runner, HTML entry selection, live preview, save-to-phone, navigation updates, phone Klein runtime and autonomy fixes. Android compilation and regression checks passed for this exact commit. Debug-signed APK; physical-phone operation and compatibility with an existing installation signature remain unverified. Qwen weights may require initial download. Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --prerelease
