name: Assemble Last Fuxk source and build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'The-Last-Fuck-Missing-10MB-Part-*-of-4.zip'
      - 'scripts/assemble_parts.py'
      - '.github/workflows/import-visual-builder-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the four ZIP uploads
        uses: actions/checkout@v4
        with:
          ref: main
          path: incoming
      - name: Check out Android repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/agent-autonomy-hands
          path: repair
          persist-credentials: true
      - name: Verify and assemble four source parts
        run: |
          python3 incoming/scripts/assemble_parts.py \
            --input incoming --output "$RUNNER_TEMP/verified-source"
      - name: Import verified files without deleting existing sources
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/verified-source/." repair/
          test -s repair/AndroidManifest.xml
          test -s repair/build.sh
          test -s repair/tests/run.sh
          git -C repair config user.name 'github-actions[bot]'
          git -C repair config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd repair
          git add -f -A -- .
          if git diff --cached --quiet; then
            echo 'The repair branch already contains the same source.'
          else
            git commit -m 'Restore all four verified Last Fuxk source ZIP parts'
            git push origin HEAD:fix/agent-autonomy-hands
          fi

  build-apk:
    needs: import-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-autonomy-hands
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        run: |
          export ANDROID_PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          bash build.sh "$GITHUB_WORKSPACE/The-Last-Fuck-debug.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Fuck-debug-apk
          path: The-Last-Fuck-debug.apk
          if-no-files-found: error
          retention-days: 14

  source-regression:
    needs: import-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-autonomy-hands
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch org.json test dependency
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/json.jar" \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          test -s "$RUNNER_TEMP/json.jar"
      - name: Run existing regression suite
        run: |
          export JSON_JAR="$RUNNER_TEMP/json.jar"
          bash tests/run.sh
